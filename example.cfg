[model]

# Set custom output label (e.g. label_YYYYMMDDTHHMMSSS).
# Default is "output"
#
output_label = test

# Output path (default current working directory)
# Converts to $output_path/$output_label_YYYYMMDDTHHMMSSS
#
#output_dir = 

# Scratch directory (where traveltimes, raypaths, etc stored. Recommend RAM partition (e.g. /dev/shm)
# Default is output_dir/scratch
#
scratch_dir = /dev/shm/pyvoro_test

# Log file name (default pyvorotomo.log)
#
#log_file =

# Define event catalog loadable via pd.read_hdf(path, key="events") (and key="arrivals")
#
events_path = /path/to/catalog.h5

# Define network/stations loadable via pd.read_hdf(path, key="stations")
#
stations_path = /path/to/stations.h5

# Velocity model loadable via pykonal.fields.read_hdf(path)
#
initial_pwave_path = /path/to/P.vel.h5
initial_swave_path = /path/to/S.vel.h5

# Generate 1D velocity models (as csv) during the final iteration
# These are stacked and QC'd the same as 3D calculation with uniform
# dz depths (same as input 3D model)
# Default is "True" (trival extra processing time)
#
output_1d_model = True

# Perform a "checkerboard" resolution test at the end?
#
perform_res_test = True

# Checkerboard horizontal size (km), and strength of anomaly (decimal ratio)
#
res_test_size_mag = 75,0.08

# Depths (km) where checkerboard will flip polarity (default is 10,25,50,70,120,170,230)
#
res_test_layers = 6,18,50

# If pyvorotomo is ran with the -t flag, then ONLY do the checkerboard test assuming
#   the latest model and catalogs found in the rerun_restest directory
#
rerun_restest = /path/to/pyvorotomo_data/output_SWAN06

# IF SET, filter stations (only! events will be subsequently filtered via max_dist)
# format is: minlat,minlon,maxlat,maxlon (degrees)
#
#map_filter = -31,115,-27,120

# IF SET, points to a CSV with columns: (event_id | eq_id), network, station, phase
# These picks are treated as ground truth throughout the inversion: exempt from
# outlier culling and given maximum inversion weight, and assigned a near-zero pick
# uncertainty during relocation. If always_include_truepicks is True (default),
# they are included in EVERY realization (otherwise selected randomly with the rest).
# It may be wise to manually pick a few large events and keep them involved throughout the inversion
#
#truepicks_path = manualpicks.csv
always_include_truepicks = true


[algorithm]
# Number of iterations to perform.
# Recommend 5+, monitor mean velocity variance in log for guidance.
#
niter    = 10

# Number of random realizations per iteration.
# At least 50, 100 is safer? After all raypaths loaded they get pretty fast. 
#
nreal    = 100

# Model iterations are computed via stacking all realizations and taking
#  the MEAN value of the TRIMMED stack by default.
# This can cause issues for heavily skewed distributions, or for highly variable/insufficient realizations
# Users can choose "mean" (default) or "median"
#
stack_type = mean

# Users may also optionally trim stack_trim_percent (%) of the lowest and highest values in
#  the stack (both 3D and 1D), mostly benefiting the "mean" calculation. By default it is 20%
#  i.e. 40% of the stack comprising the highest and lowest values are cut prior to taking mean or median
#
stack_trim_percent = 20

# Number of events & arrivals to sample per realization.
# Confirm good numbers with average rays per cell. 
# Ballpark: events 40% of total and arrivals 20% of total? (per phase!)
# Note that many arrivals may be QC'd out via min residual AND tukey fencing, 
#   so best to juice narrival a bit higher than your desired amount
#
#nevent = 3000
#narrival = 20000

# alternatively, can express via % of total available (per run!)
#   **if set, over-rides nevent and narrival**
#     recommended!
#
nevent_percent = 45

# note that narrivals will be a ratio of the remaining arrivals pre-decimated
#   so from your total you divide /2 for P/S then multiply by nevent_percent
#
narrival_percent = 45

# Threshold for # arrivals for each event.
#    Events with fewer than min_arrival arrivals are removed at the start.
# If using a "cleaned" catalog, may need to lower this
#
min_narrival = 13

# Remove events by distance and depth (km)
# Recommend min_dist at 2-3x model resolution. Note this is 3D, so an event
# directly beneath a station but deeper than min_dist will get through. 
# max_dist should be 150 km for or less to avoid moho refraction,
#  or if using raypath_bottom_mask, set to whatever depth your model allows
#  to avoid refracted waves and reflections
#
min_dist=9
max_dist=150
#min_depth=0
#max_depth=15

# Remove raypaths that bottom (e.g. minimum rho) between these depths (km)
#  Useful to avoid moho refraction issues but still let in distant events
#  (default is no mask)
#
raypath_bottom_mask = 25,40

# Remove arrivals & events if residuals (seconds) too large-- HARD LIMIT!
#    Don't set TOO tightly.. things may improve!
#    Remember, Tukey fencing will remove relative arrival residuals per realization
#     and you can also downweigh by residual (solver_weight params below)
#
max_arrival_residual = 3.0
max_event_residual = 2.0

# Multiplicative factor for arrivals outlier removal using Tukey fences
# Applied per realization to the selected samples before being weighted
#   Smaller values = stricter QC
#   ex IQR = 1.349 x std. 
#     so, IQR 0.741 = 1.0 std, IQR 1.0 = 2.0 std, IQR 1.5 = 2.7 std, IQR 3.0 = 4.7 std
#
outlier_removal_factor = 1.5

# Solver weight relative to arrival residuals
# Applied to the observations in the G matrix calc in compute_model_update
# Options are: huber (default; softest), cauchy (medium), bisquare (aggressive)
#
solver_weight_method = huber

# Optionally define the weight tuning. If < 0, use default from method
#  "huber": down-weight proportionally beyond MAD threshold (default 1.345)
#  "cauchy": down-weigh strongly beyond MAD threshold (default 2.235)
#  "bisquare": down-weigh absolutely beyond MAD threshold (default 4.685)
# 
solver_weight_tuning = -1

# The weight scheme increases "blends" linearly with each iteration so that early iterations are not/less affected. Scale 0-1
#  Set both to 0 to skip weighing entirely, or both to the same value for constant weighting (not advised!)
#   default start = 0.3, default end = 0.9 (ie maximum 90% weight scaling at the last iteration)
#
solver_weight_start=0.3
solver_weight_end=0.9


# Remove events that have migrated beyond these limits. Only checks first 3 iterations.
#   lat/lon in degrees, depth in km, time in seconds
# May be good to restart with these relocated events pre-removed from your starting catalog
#
max_dlat = 0.15
max_dlon = 0.15
max_ddepth = 25
max_dtime = 2.0

# Maximum allowed depth in km.
# If set, assign hard boundaries that events cannot migrate past
#    to avoid "runaway relocations" in poorly resolved areas
#
# min_depth = 0
max_depth = 20

# Limit the lateral distance (km) around each station to compute traveltimes
# Handy to speed-up ray tracing and reduce model storage space
# default (-1) automatically scales to 142% (root2) of max_dist
# 0 disabled and computes traveltimes for the full model (original behavior)
tt_crop_km = -1


# Set which phases to run, and in what order
#   Default is P and then S, but world's your oyster
#
phase_order = P,S

# The following parameters (atol, btol, maxiter, conlim, and damp)
#   are passed through directly to scipy.sparse.linalg.lsmr().
# You may need to adjust based on the number of LSMR iterations you are seeing (hopefully < 300)
# Probably should set btol to your fundamental phase pick uncertainty (be honest!)
#
atol = 1e-4
btol = 0.05

# You shouldn't see anything close to 500 hopefully...
maxiter = 500

# Stops iterating if ||G^-1||||G|| (condition number estimate, conda) exceeds this
conlim = 500

# If damp < -10, a default value is generated which slightly increases per iteration
# If -10 < damp <0, damping is calculated by finding the L-curve corner
#   however this is only done for the first 10 realizations, and the average of these is
#   used for the rest of the runs. Experimental!
# If damp >= 0, this scalar value is used always
damp = -1

# Station terms in solver LSMR 
# if < 0, lets stations be completely free in the inversion (probably overly permissive)
# Otherwise, apply damping (if set to 0 it will be 1e-9, fully clamped).
# To fix stations, essentially set to a very small positive number
# Default is 1e-3 (e.g. assume almost no station contribution / mostly pure EQ inversion)
#
sigma_station = 0.001

# These parameters optionally cease an iteration prematurely if realizations stop being useful
# These settings are pretty conservative already and likely won't hit
#
stack_convergence_tol = 0.02
stack_convergence_min_nreal = 30
stack_convergence_check_every = 5
stack_convergence_patience = 3


[meshing]

# Initial mesh will initially target max_cell size of Voronoi cells
# in addition to whatever data-driven adaptive parameters provided
# Defaults are 150 & 20 km. Recommend starting quite large.
#
max_cell_width_km = 150

# Cells will not get smaller than the min, regardless of other settings.
# Maybe 3-5x of your model resolution?
#
min_cell_width_km = 20

# If true, initial mesh will subdivide according to target rays and min_cell_width
# Highly recommended
#
enable_backfill = True

# Size of cells will subdivide until this is met, or minimum size reached (default 25)
target_rays_per_cell = 25

# How many raypaths have to travel through a cell for it to be counted (default is 5)
# Otherwise the cell effectively vanishes (at periphery, otherwise cells will just enlarge to suit)
#
min_rays_per_cell = 5

# Horizontal-to-vertical ratio for Voronoi cell generation
# Values > 1 will have increased vertical cell density (scales linear)
# Unless you are doing something odd, you will probably want this to be 2-7
#
hvr = 3

# Should Voronoi cells be generated adaptively and to what degree?
# This controls how far (%) cells will be adjusted based on raypath density and velocity gradients
# Recommended! (Default is 0.6, disabled/purely random if set to 0)
#
adaptive_data_weight = 0.6

# What should the adaptive algorithm prioritize? This sets the relative weight between
#   raypath density and HORIZONTAL velocity model gradients. Values > 0.5 will place more adaptive
#   cells in areas of higher raypath density, < 0.5 prefer higher velocity gradients.
# Default is 0.5, an even mix. Only applies if adaptive_data_weight > 0.
#
density_to_gradient_weight = 0.5


[analyze]
# Various tuning parameters for pick, event, and station diagnostics. 

# Analyze pick residuals over time from iteration to iteration
#
# Turns on/off
pick_drop = False

# Don't do anything until this iteration. Lets the inversion normalize first.
#
pick_start_iter = 3

# Number of iterations AFTER starting to actually start computing pick diagnostics
# e.g. the "burn-in" time to develop robust statistics
# For example, if pick_start_iter is 3, then won't start doing this running pick analysis
# until the current iteration is 3 + pick_min_iters_present
#
pick_min_iters_present = 3

# The maximum median pick residual over tracked iterations
#
pick_median_threshold = 0.7

# The maximum MAD residual scatter
#
pick_mad_max = 0.5

# The maximum multiple of its own station-phase baseline
# Separates bad picks from biased stations
#
pick_station_excess = 3.0

# If the % of dropped picks exceed this, do nothing
# Prevents catastrophic removal of data (keep highish / check logs)
#
pick_max_drop_fraction = 0.10


# Adaptive detection floor for flagging bad picks.
# The effective threshold is max(pick_median_threshold, pick_scale_k * noise_scale),
#   where noise_scale is the MAD of the (event- and station-demeaned) per-pick
#   median residuals -- i.e. this dataset's own pick-noise level, measured each run.
# So pick_median_threshold is a hard floor in seconds, and pick_scale_k sets how
#   many noise-widths above the noise a pick must sit to be flagged.
# Think of it like a sigma cutoff: higher = stricter (fewer flags, higher precision),
#   lower = more permissive (more flags, higher recall).
#   ~4.0 is conservative (default), ~3.0 is a sensible balance, <2.5 gets noisy.
# Only the larger of the two limits applies, so raising pick_median_threshold above
#   pick_scale_k * noise_scale makes this parameter inactive.
#
# Adaptive flag threshold = max(pick_median_threshold, pick_scale_k * data noise MAD).
#   Acts like a sigma cutoff: higher = stricter. 4.0 default, 3.0 balanced, <2.5 noisy.
#
pick_scale_k = 3.5


# EVENT diagnostic analysis (does not affect model)
#
event_residual_threshold = 0.6
event_weight_threshold = 0.01
event_std_threshold = 0.6

# STATION diagnostic analysis (does not affect model)
#
station_residual_threshold = 0.6
station_std_threshold = 0.6



[relocation]
# This section modulates the Pykonal solver/locator

# Choose between the legacy L1 or NLL-inspired EDT
# EDT = Equal Differential Time (and the default). More robust to outliers!
# note that L1 is used for teleseisms or 1-phase events
#
method = EDT

# These set the "search range" in the DE algorithm
# If too small, effectively limits the maximum amount an event can be relocated at once
# Set these to your expected errors-- if too tight the pick quality tracking can be degraded
#
depth_min = -1.0
dlat = 0.1
dlon = 0.1
ddepth = 10
dtime = 0.5

# Set a uniform pick uncertainty for pykonal.locate. 2x samplerate should be your theoretical minimum.
# Default is 0.02
#
#pick_uncert = 0.02

# Also add the cumulative traveltime model error (default 2% or 0.02) (as of Pykonal >= 0.5.1)
# e.g. 0.02 tt_error * 10 second traveltime = +0.2 seconds uncertainty added to that phase in PyKonal RMS calc
# (similar, but not quite the same as NonLinLoc's LOCGAU SigmaTime)
# Testing seems to show that 0.02 works best, and don't go higher than 0.05
#
tt_error = 0.02
